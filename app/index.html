<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel Santos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 200;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 25%, #fecfef 50%, #c3ec52 75%, #4facfe 100%);
            min-height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        .background-cup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vmin;
            height: 80vmin;
            z-index: 1;
            opacity: 0.15;
        }

        .cup {
            position: relative;
            width: 100%;
            height: 70%;
            border: 8px solid rgba(255, 255, 255, 0.6);
            border-bottom: 12px solid rgba(255, 255, 255, 0.7);
            border-radius: 0 0 30% 30%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(40px);
            overflow: hidden;
            margin: 0 auto;
        }

        .cup::before {
            content: '';
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            height: 5%;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 20px 20px 0 0;
        }

        .cup-handle {
            position: absolute;
            right: -15%;
            top: 25%;
            width: 12%;
            height: 35%;
            border: 8px solid rgba(255, 255, 255, 0.6);
            border-left: none;
            border-radius: 0 40px 40px 0;
            background: transparent;
        }

        .liquid {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(45deg, #4facfe 0%, #00f2fe 50%, #4facfe 100%);
            background-size: 300% 300%;
            animation: liquidShimmer 4s ease-in-out infinite;
            transition: height 1s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 0 0 25% 25%;
        }

        .liquid::before {
            content: '';
            position: absolute;
            top: -3%;
            left: 0;
            right: 0;
            height: 6%;
            background: radial-gradient(ellipse 100% 50% at center, rgba(255, 255, 255, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            animation: wave 3s ease-in-out infinite;
        }

        .overflow {
            position: absolute;
            top: -3%;
            left: -5%;
            right: -5%;
            height: 8%;
            background: linear-gradient(45deg, #4facfe 0%, #00f2fe 50%, #4facfe 100%);
            background-size: 300% 300%;
            animation: liquidShimmer 4s ease-in-out infinite;
            border-radius: 50px;
            opacity: 0;
            transform: scaleY(0);
            transform-origin: bottom;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .overflow.active {
            opacity: 0.8;
            transform: scaleY(1);
            animation: liquidShimmer 4s ease-in-out infinite, overflow 1.5s ease-in-out infinite;
        }

        .main-content {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 5vw;
        }

        .name {
            font-size: clamp(4rem, 12vw, 8rem);
            font-weight: 100;
            color: rgba(0, 0, 0, 0.8);
            margin-bottom: 2vh;
            letter-spacing: -0.02em;
            line-height: 0.9;
        }

        .subtitle {
            font-size: clamp(1rem, 2.5vw, 1.8rem);
            font-weight: 200;
            color: rgba(0, 0, 0, 0.6);
            margin-bottom: 4vh;
            max-width: 60ch;
            line-height: 1.4;
        }

        .social-links {
            display: flex;
            gap: 1.5vw;
            margin-bottom: 6vh;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .social-link {
            position: relative;
            padding: 1.2rem 2.5rem;
            border-radius: 15px;
            text-decoration: none;
            font-weight: 400;
            font-size: clamp(0.9rem, 1.5vw, 1.1rem);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 0.8rem;
            overflow: hidden;
            border: 2px solid transparent;
        }

        .social-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.6s;
        }

        .social-link:hover::before {
            left: 100%;
        }

        .linkedin {
            background: linear-gradient(135deg, #0077B5 0%, #005885 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(0, 119, 181, 0.3);
        }

        .linkedin:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 35px rgba(0, 119, 181, 0.4);
        }

        .github {
            background: linear-gradient(135deg, #333 0%, #24292e 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(51, 51, 51, 0.3);
        }

        .github:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 35px rgba(51, 51, 51, 0.4);
        }

        .whatsapp {
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.3);
        }

        .whatsapp:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 35px rgba(37, 211, 102, 0.4);
        }

        .email {
            background: linear-gradient(135deg, #EA4335 0%, #D33B2C 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(234, 67, 53, 0.3);
            cursor: pointer;
        }

        .email:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 35px rgba(234, 67, 53, 0.4);
        }

        .icon {
            font-size: 1.2em;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        .content-sections {
            display: flex;
            justify-content: center;
            width: 100%;
            max-width: 500px;
        }

        .content-section {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(20px);
            transition: all 0.3s ease;
        }

        .content-section:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-3px);
        }

        .section-title {
            font-size: clamp(1.1rem, 2vw, 1.3rem);
            font-weight: 300;
            color: rgba(0, 0, 0, 0.8);
            margin-bottom: 1.5rem;
            letter-spacing: -0.01em;
        }

        .section-content {
            color: rgba(0, 0, 0, 0.6);
            font-size: clamp(0.9rem, 1.5vw, 1rem);
            font-weight: 200;
            line-height: 1.6;
        }

        .add-link {
            display: inline-block;
            margin-top: 1rem;
            color: rgba(68, 133, 244, 0.8);
            text-decoration: none;
            font-weight: 300;
            font-size: 0.9rem;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }

        .add-link:hover {
            opacity: 1;
        }

        .link-item {
            display: block;
            color: rgba(0, 0, 0, 0.6);
            text-decoration: none;
            padding: 0.8rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: 200;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .link-item:hover {
            color: rgba(0, 0, 0, 0.8);
            transform: translateX(3px);
        }

        .link-item:last-child {
            border-bottom: none;
        }

        .link-icon {
            font-size: 1.1em;
            opacity: 0.7;
        }

        /* Email Modal */
        .email-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 300;
            color: #333;
            margin-bottom: 1rem;
        }

        .modal-text {
            color: #666;
            margin-bottom: 2rem;
            font-weight: 200;
        }

        .captcha-container {
            margin: 1.5rem 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            font-size: 1.2rem;
            font-weight: 400;
        }

        .captcha-input {
            padding: 0.8rem;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1.1rem;
            text-align: center;
            width: 80px;
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .modal-btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 10px;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #4285f4;
            color: white;
        }

        .btn-primary:hover {
            background: #3367d6;
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #333;
            border: 1px solid #ddd;
        }

        .btn-secondary:hover {
            background: #e8eaed;
        }

        .email-revealed {
            background: rgba(76, 175, 80, 0.1);
            border: 2px solid #4CAF50;
            padding: 1rem;
            border-radius: 10px;
            margin-top: 1rem;
            font-weight: 400;
            color: #2E7D32;
        }

        .countdown-info {
            position: absolute;
            bottom: 3vh;
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(0.8rem, 1.2vw, 0.9rem);
            font-weight: 200;
            color: rgba(0, 0, 0, 0.5);
            text-align: center;
            z-index: 10;
        }

        @keyframes liquidShimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes wave {
            0%, 100% { transform: scaleX(1) scaleY(1); }
            50% { transform: scaleX(1.05) scaleY(0.9); }
        }

        @keyframes overflow {
            0%, 100% { transform: scaleY(1) scaleX(1); }
            50% { transform: scaleY(0.9) scaleX(1.1); }
        }

        @media (max-width: 768px) {
            .content-sections {
                grid-template-columns: 1fr;
                gap: 4vw;
            }
            
            .social-links {
                gap: 3vw;
            }
            
            .main-content {
                padding: 0 8vw;
            }
        }

        @media (max-height: 600px) {
            .name {
                margin-bottom: 1vh;
            }
            
            .subtitle {
                margin-bottom: 2vh;
            }
            
            .social-links {
                margin-bottom: 3vh;
            }
        }
    </style>
</head>
<body>
    <div class="background-cup">
        <div class="cup">
            <div class="cup-handle"></div>
            <div class="liquid" id="background-liquid"></div>
            <div class="overflow" id="background-overflow"></div>
        </div>
    </div>

    <main class="main-content">
        <h1 class="name">Daniel Santos</h1>
        
        <p class="subtitle">Stay connected for early access to our newest tools and local events</p>
        
        <div class="social-links">
            <a href="https://www.linkedin.com/in/brasileiro" class="social-link linkedin" target="_blank">
                <span class="icon">💼</span>
                LinkedIn
            </a>
            <a href="https://github.com/w3b3" class="social-link github" target="_blank">
                <span class="icon">🐱</span>
                GitHub
            </a>
            <a href="https://wa.me/18199195996" class="social-link whatsapp" target="_blank">
                <span class="icon">💬</span>
                WhatsApp
            </a>
            <div class="social-link email" onclick="openEmailModal()">
                <span class="icon">✉️</span>
                Email
            </div>
        </div>
        
        <div class="content-sections">
            <section class="content-section">
                <h2 class="section-title">Recommended</h2>
                <div class="section-content" id="recommended-content">
                    <a href="https://tatame0.com" class="link-item" target="_blank">
                        <span class="link-icon">🥋</span>
                        Tatame0
                    </a>
                    <a href="https://claude.ai" class="link-item" target="_blank">
                        <span class="link-icon">🤖</span>
                        Claude AI
                    </a>
                    <a href="https://canada.ca" class="link-item" target="_blank">
                        <span class="link-icon">🍁</span>
                        Canada.ca
                    </a>
                </div>
            </section>
        </div>
    </main>

    <div class="countdown-info" id="countdown-info">
        Cup filling until Sunday...
    </div>

    <!-- Email Modal -->
    <div class="email-modal" id="emailModal">
        <div class="modal-content">
            <h3 class="modal-title">Verify you're human</h3>
            <p class="modal-text">Please solve this simple math problem to reveal my email address:</p>
            
            <div class="captcha-container">
                <span id="captcha-question"></span>
                <input type="number" class="captcha-input" id="captcha-answer" placeholder="?">
            </div>
            
            <div class="modal-buttons">
                <button class="modal-btn btn-primary" onclick="verifyCaptcha()">Verify</button>
                <button class="modal-btn btn-secondary" onclick="closeEmailModal()">Cancel</button>
            </div>
            
            <div id="email-result"></div>
        </div>
    </div>

    <script>
        // Visual Countdown Timer
        function updateVisualCountdown() {
            const now = new Date();
            const nextSunday = new Date();
            
            // Find next Sunday
            const daysUntilSunday = (7 - now.getDay()) % 7;
            if (daysUntilSunday === 0 && now.getHours() === 0 && now.getMinutes() === 0 && now.getSeconds() === 0) {
                nextSunday.setDate(now.getDate() + 7);
            } else if (daysUntilSunday === 0) {
                nextSunday.setDate(now.getDate() + 7);
            } else {
                nextSunday.setDate(now.getDate() + daysUntilSunday);
            }
            
            nextSunday.setHours(0, 0, 0, 0);
            
            const timeLeft = nextSunday.getTime() - now.getTime();
            const totalWeekTime = 7 * 24 * 60 * 60 * 1000;
            const timeElapsed = totalWeekTime - timeLeft;
            const progress = Math.min(timeElapsed / totalWeekTime, 1);
            
            // Update background liquid height
            const liquid = document.getElementById('background-liquid');
            const liquidHeight = Math.max(0, Math.min(100, progress * 100));
            liquid.style.height = `${liquidHeight}%`;
            
            // Update countdown info
            const countdownInfo = document.getElementById('countdown-info');
            const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            
            // Handle overflow when Sunday arrives
            const overflow = document.getElementById('background-overflow');
            
            if (timeLeft <= 0) {
                overflow.classList.add('active');
                countdownInfo.textContent = '🎉 Sunday overflow!';
                liquid.style.height = '100%';
            } else if (progress > 0.95) {
                countdownInfo.textContent = `Almost overflowing... ${hours}h remaining`;
            } else if (days > 0) {
                countdownInfo.textContent = `${Math.round(progress * 100)}% filled • ${days} day${days !== 1 ? 's' : ''} until Sunday`;
            } else {
                countdownInfo.textContent = `${Math.round(progress * 100)}% filled • ${hours}h until Sunday`;
            }
        }
        
        // Email Modal Functions
        let captchaAnswer = 0;
        
        function generateCaptcha() {
            const num1 = Math.floor(Math.random() * 10) + 1;
            const num2 = Math.floor(Math.random() * 10) + 1;
            captchaAnswer = num1 + num2;
            document.getElementById('captcha-question').textContent = `${num1} + ${num2} =`;
        }
        
        function openEmailModal() {
            generateCaptcha();
            document.getElementById('emailModal').style.display = 'flex';
            document.getElementById('captcha-answer').focus();
        }
        
        function closeEmailModal() {
            document.getElementById('emailModal').style.display = 'none';
            document.getElementById('captcha-answer').value = '';
            document.getElementById('email-result').innerHTML = '';
        }
        
        function verifyCaptcha() {
            const userAnswer = parseInt(document.getElementById('captcha-answer').value);
            const resultDiv = document.getElementById('email-result');
            
            if (userAnswer === captchaAnswer) {
                resultDiv.innerHTML = `
                    <div class="email-revealed">
                        ✅ Email verified: <strong>iam@w-b.dev</strong>
                        <br><small>Click to copy to clipboard</small>
                    </div>
                `;
                resultDiv.onclick = () => {
                    navigator.clipboard.writeText('iam@w-b.dev').then(() => {
                        resultDiv.innerHTML += '<br><small style="color: green;">📋 Copied to clipboard!</small>';
                    });
                };
            } else {
                resultDiv.innerHTML = `
                    <div style="color: #d32f2f; margin-top: 1rem;">
                        ❌ Incorrect answer. Please try again.
                    </div>
                `;
                generateCaptcha();
                document.getElementById('captcha-answer').value = '';
                document.getElementById('captcha-answer').focus();
            }
        }
        
        // Allow Enter key to submit captcha
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('captcha-answer').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    verifyCaptcha();
                }
            });
        });
        
        // Initialize countdown
        updateVisualCountdown();
        setInterval(updateVisualCountdown, 1000);
    </script>
</body>
</html>
